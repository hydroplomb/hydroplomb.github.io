<style>
  /* Page verrouillée : rien ne peut glisser de côté ni rebondir (iPhone) */
  html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; overscroll-behavior: none; background: #F2F5F7; }
  body { position: fixed; inset: 0; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
  /* Sur iPhone, un cadre s'élargit à la taille de son contenu : 1px + min-width 100 % le garde à la largeur de l'écran */
  iframe { position: relative; z-index: 1; display: block; width: 1px; min-width: 100%; max-width: 100%; height: 100%; border: 0; background: transparent; }
  #attente { position: fixed; inset: 0; z-index: 0; display: grid; place-content: center; justify-items: center; gap: 14px; font: 600 16px system-ui, sans-serif; color: #0A3550; }
  #attente img { width: 96px; height: 96px; border-radius: 22px; }
</style>
