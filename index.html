<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>HydroPlomb</title>
<meta name="description" content="Registre des sollicitations HydroPlomb : déclaration, suivi et synthèse">
<meta name="theme-color" content="#0A3550">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HydroPlomb">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* Page verrouillée : rien ne peut glisser de côté ni rebondir (iPhone) */
  html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; overscroll-behavior: none; background: #F2F5F7; }
  body { position: fixed; inset: 0; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  /* Sur iPhone, un cadre s'élargit à la taille de son contenu : 1px + min-width 100 % le garde à la largeur de l'écran */
  iframe { position: relative; z-index: 1; display: block; width: 1px; min-width: 100%; max-width: 100%; height: 100%; border: 0; background: transparent; }
  #attente { position: fixed; inset: 0; z-index: 0; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 24px; font-weight: 600; font-size: 16px; color: #0A3550; text-align: center; }
  #attente img { width: 96px; height: 96px; border-radius: 22px; }
  #attenteEtat { max-width: 300px; font-weight: 400; font-size: 15px; line-height: 1.45; color: #4F5F6B; min-height: 22px; }
  /* Panne : l'écran d'attente passe devant le cadre pour que « Réessayer » soit utilisable */
  #attente.panne { z-index: 3; background: #F2F5F7; }
  #attente.panne #attenteEtat { color: #8E1B1B; font-weight: 600; }
  #attenteReessayer { font: inherit; font-weight: 700; min-height: 48px; padding: 12px 28px; border: none; border-radius: 10px; background: #E8843A; color: #1A1006; cursor: pointer; }
  #attenteReessayer[hidden] { display: none; }
  /* Fenêtre Face ID */
  #fid { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; padding: 20px; padding-top: calc(20px + env(safe-area-inset-top, 0px)); background: rgba(242, 245, 247, 0.97); }
  #fid[hidden] { display: none; }
  .carte { width: 100%; max-width: 340px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #D5DEE4; border-radius: 16px; padding: 26px 22px; text-align: center; color: #13202B; }
  .carte img { width: 72px; height: 72px; border-radius: 16px; }
  .carte h1 { margin: 12px 0 6px; font-size: 22px; color: #0A3550; }
  .carte p { margin: 0 0 18px; font-size: 16px; line-height: 1.45; color: #4F5F6B; }
  .carte button { font: inherit; width: 100%; min-height: 48px; border-radius: 10px; cursor: pointer; }
  #fidOk { border: none; background: #E8843A; color: #1A1006; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }
  #fidOk:disabled { opacity: 0.6; }
  .lien { background: none; border: none; color: #0A3550; font-weight: 600; text-decoration: underline; margin-top: 8px; }
  .petit { font-size: 14px !important; color: #4F5F6B !important; font-weight: 400 !important; }
  .err { color: #8E1B1B !important; font-weight: 600; margin: 12px 0 0 !important; font-size: 15px !important; }
</style>
</head>
<body>
<div id="attente">
  <img src="icone-192.png" alt="">
  <span id="attenteTitre">Ouverture de HydroPlomb…</span>
  <span id="attenteEtat" role="status"></span>
  <button id="attenteReessayer" type="button" hidden>Réessayer</button>
</div>
<!-- L'application elle-même (Google Apps Script). Cette page lui donne un nom, une icône, la connexion par Face ID,
     et surveille son ouverture : sur le réseau mobile, une connexion à Google reste parfois bloquée. -->
<iframe id="app" src="https://script.google.com/macros/s/AKfycbzegRkLxSnDUaqEdPZiiCcTpi02KFYlTcwSp8TCINjlLdmRhSZP2iToUdvBG0mi8lbJ/exec"
        title="HydroPlomb" allow="clipboard-write"></iframe>

<div id="fid" hidden role="dialog" aria-modal="true" aria-labelledby="fidTitre">
  <div class="carte">
    <img src="icone-192.png" alt="">
    <h1 id="fidTitre">HydroPlomb</h1>
    <p id="fidTexte"></p>
    <button id="fidOk" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M9 9v1M15 9v1M12 9v4h-1M9 16c1.5 1 4.5 1 6 0"/></svg>
      <span id="fidOkTexte"></span>
    </button>
    <button id="fidNon" class="lien" type="button"></button>
    <button id="fidOff" class="lien petit" type="button" hidden></button>
    <p id="fidErr" class="err" role="alert" hidden></p>
  </div>
</div>

<script>
/* Connexion par Face ID : la clé d'accès (passkey) est créée sur le téléphone pour hydroplomb.github.io.
   Face ID déverrouille un jeton de connexion gardé ici (jamais le mot de passe), que cette page transmet
   à l'application. Le jeton est annulé si le mot de passe du compte est changé dans le registre. */
(function () {
  var FID = 'hp_faceid', ETAT = 'hp_etat', REFUS = 'hp_faceid_refus';
  var APP = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;   // origine du cadre de l'application
  var $ = function (id) { return document.getElementById(id); };
  var fid = $('fid'), texte = $('fidTexte'), ok = $('fidOk'), okTexte = $('fidOkTexte'), non = $('fidNon'), off = $('fidOff'), err = $('fidErr');
  var app = null, origineApp = null, mode = null, aActiver = null, enAttente = null;
  var ua = navigator.userAgent;
  var ios = /iP(hone|ad|od)/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var LIB = ios ? 'Face ID' : /Mac/.test(navigator.platform) ? 'Touch ID' : /Android/i.test(ua) ? 'l’empreinte' : /Windows/i.test(ua) ? 'Windows Hello' : 'l’empreinte ou le visage';
  var APPAREIL = ios ? (/iPad/.test(ua) ? 'cet iPad' : 'cet iPhone') : 'cet appareil';

  function lire(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function ecrire(k, v) { try { if (v) localStorage.setItem(k, JSON.stringify(v)); else localStorage.removeItem(k); } catch (e) {} }
  function versB64(buf) { var s = String.fromCharCode.apply(null, new Uint8Array(buf)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function depuisB64(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function alea(n) { var u = new Uint8Array(n); crypto.getRandomValues(u); return u; }
  function disponible() { return !!(window.PublicKeyCredential && navigator.credentials && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable); }
  function envoyer(m) { if (app) app.postMessage(m, origineApp); }
  /* Dit à l'application si Face ID est possible sur ce téléphone et s'il est déjà activé (bouton « Activer Face ID ») */
  var uvpaa = false;
  if (disponible()) PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function (oui) { uvpaa = !!oui; annoncer(); }, function () {});
  function annoncer() { var f = lire(FID); envoyer({ hp: 'porte', faceid: uvpaa, actif: !!(f && f.jeton), libelle: LIB }); }

  function montrer(m) {
    mode = m; err.hidden = true; ok.disabled = false;
    var s = lire(FID);
    if (m === 'deverrouiller') {
      texte.textContent = 'Connectez-vous en un regard' + (s && s.ident ? ' (compte ' + s.ident + ')' : '') + '.';
      okTexte.textContent = 'Se connecter avec ' + LIB;
      non.textContent = 'Utiliser identifiant et mot de passe';
      off.textContent = 'Désactiver ' + LIB + ' sur ' + APPAREIL;
      off.hidden = false;
    } else {
      texte.textContent = 'Activer ' + LIB + ' sur ' + APPAREIL + ' ? Vous n’aurez plus à saisir votre identifiant ni votre mot de passe.';
      okTexte.textContent = 'Activer ' + LIB;
      non.textContent = 'Plus tard';
      off.hidden = true;
    }
    fid.hidden = false;
    ok.focus();
  }
  function cacher() { fid.hidden = true; mode = null; }

  ok.addEventListener('click', function () {
    ok.disabled = true; err.hidden = true;
    if (mode === 'deverrouiller') {
      var s = lire(FID); if (!s) { cacher(); return; }
      navigator.credentials.get({ publicKey: { challenge: alea(32), allowCredentials: [{ type: 'public-key', id: depuisB64(s.id) }], userVerification: 'required', timeout: 60000 } })
        .then(function () {
          cacher();
          if (s.jeton) { var g = lire(ETAT); envoyer({ hp: 'jeton', jeton: s.jeton, etat: g && g.j === s.jeton ? g : null }); }
          else if (s.mdp) envoyer({ hp: 'identifiants', ident: s.ident, mdp: s.mdp });   // ancien enregistrement : remplacé par un jeton
        })
        .catch(function () { ok.disabled = false; err.textContent = LIB + ' n’a pas abouti. Réessayez, ou utilisez votre mot de passe.'; err.hidden = false; });
    } else if (mode === 'activer' && aActiver) {
      navigator.credentials.create({ publicKey: {
          rp: { name: 'HydroPlomb' },
          user: { id: alea(16), name: aActiver.ident, displayName: aActiver.ident },
          challenge: alea(32),
          pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
          authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
          attestation: 'none', timeout: 60000 } })
        .then(function (c) {
          // La clé est créée : l'application demande au serveur un jeton durable, que cette page gardera.
          enAttente = { id: versB64(c.rawId), ident: aActiver.ident }; aActiver = null; cacher();
          envoyer({ hp: 'faceid-active' });
        })
        .catch(function () { ok.disabled = false; err.textContent = 'L’activation n’a pas abouti. Vous pourrez réessayer à la prochaine connexion.'; err.hidden = false; });
    }
  });
  non.addEventListener('click', function () {
    if (mode === 'activer' && aActiver) { try { sessionStorage.setItem(REFUS, aActiver.ident); } catch (e) {} aActiver = null; }
    cacher();
  });
  off.addEventListener('click', function () {
    var s = lire(FID);
    if (s && s.jeton) envoyer({ hp: 'oublier', jeton: s.jeton });   // le serveur annule le jeton
    ecrire(FID, null); ecrire(ETAT, null); cacher(); annoncer();
  });

  /* Messages de l'application (Google Apps Script) */
  window.addEventListener('message', function (e) {
    if (!APP.test(e.origin)) return;
    var d = e.data || {};
    if (typeof d.hp !== 'string') return;
    var nouveau = !app;
    app = e.source; origineApp = e.origin;
    vivant();
    if (nouveau || d.hp === 'bonjour') annoncer();
    if (d.hp === 'pret') {
      if (lire(FID) && disponible()) montrer('deverrouiller'); else cacher();
    } else if (d.hp === 'connecte' && d.ident) {
      if (lire(FID) || !disponible()) return;
      var refus = ''; try { refus = sessionStorage.getItem(REFUS) || ''; } catch (x) {}
      if (refus === d.ident) return;
      PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function (oui) {
        if (oui) { aActiver = { ident: String(d.ident) }; montrer('activer'); }
      });
    } else if (d.hp === 'activer-faceid') {
      // Demandé depuis le bouton de l'application : même fenêtre qu'après une connexion
      if (!uvpaa) return;
      try { sessionStorage.removeItem(REFUS); } catch (x) {}
      aActiver = { ident: String(d.ident || 'HydroPlomb') }; montrer('activer');
    } else if (d.hp === 'jeton-durable' && typeof d.jeton === 'string' && d.jeton) {
      if (enAttente) { ecrire(FID, { id: enAttente.id, ident: enAttente.ident, jeton: d.jeton }); enAttente = null; }
      else { var s = lire(FID); if (s && !s.jeton) { delete s.mdp; s.jeton = d.jeton; ecrire(FID, s); } }
      annoncer();
    } else if (d.hp === 'faceid-impossible') {
      enAttente = null;
    } else if (d.hp === 'etat') {
      var f = lire(FID);
      if (f && f.jeton && d.g && d.g.j === f.jeton) { try { localStorage.setItem(ETAT, JSON.stringify(d.g)); } catch (x) {} }
    } else if (d.hp === 'echec') {
      ecrire(FID, null); ecrire(ETAT, null); annoncer();
    }
  });

  /* L'application a peut-être dit bonjour avant que cette page écoute : on se présente aux cadres dès leur chargement. */
  function saluer(w, n) { try { for (var k = 0; k < w.frames.length; k++) { w.frames[k].postMessage({ hp: 'porte-prete' }, '*'); if (n < 3) saluer(w.frames[k], n + 1); } } catch (e) {} }
  $('app').addEventListener('load', function () {
    setTimeout(function () { saluer($('app').contentWindow, 0); }, 400);
    setTimeout(function () { if (!app) saluer($('app').contentWindow, 0); }, 2500);
  });

  /* Surveillance de l'ouverture : si l'application ne s'est pas annoncée à temps,
     la page la recharge (deux fois : après 15 s, puis 20 s), puis propose « Réessayer ». */
  var SRC = $('app').getAttribute('src'), essai = 1, minuteur = null, lent = null;
  function vivant() {
    clearTimeout(minuteur); clearTimeout(lent);
    $('attente').className = ''; $('attenteTitre').textContent = 'Ouverture de HydroPlomb…'; $('attenteEtat').textContent = ''; $('attenteReessayer').hidden = true;
  }
  function surveiller() {
    clearTimeout(minuteur); clearTimeout(lent);
    lent = setTimeout(function () { if (!app) $('attenteEtat').textContent = 'Connexion lente, merci de patienter…'; }, 6000);
    minuteur = setTimeout(function () {
      if (app) return;
      if (essai < 3) { essai++; $('attenteEtat').textContent = 'Nouvel essai de connexion (' + essai + ' sur 3)…'; recharger(); }
      else {
        $('attente').className = 'panne';
        $('attenteTitre').textContent = 'HydroPlomb ne répond pas';
        $('attenteEtat').textContent = 'Vérifiez votre connexion (Wi-Fi ou données mobiles), puis réessayez.';
        $('attenteReessayer').hidden = false; $('attenteReessayer').focus();
      }
    }, essai === 1 ? 15000 : 20000);
  }
  function recharger() { $('app').setAttribute('src', SRC + (SRC.indexOf('?') < 0 ? '?' : '&') + 'essai=' + essai + '-' + Date.now()); surveiller(); }
  $('attenteReessayer').addEventListener('click', function () {
    essai = 1; $('attente').className = ''; $('attenteReessayer').hidden = true; $('attenteTitre').textContent = 'Ouverture de HydroPlomb…';
    $('attenteEtat').textContent = 'Nouvel essai de connexion…'; recharger();
  });
  surveiller();
})();
</script>
</body>
</html>
